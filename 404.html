<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>404 — Página não encontrada | IA BRAZIL</title>
  <link rel="icon" href="/favicon.png" sizes="96x96" type="image/png">
  <style>
    @font-face {
      font-family: Inter;
      src: url("/assets/fonts/inter/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }

    @font-face {
      font-family: Aeonik;
      src: url("/assets/fonts/aeonik/Aeonik-Italic-VF.woff2") format("woff2");
      font-style: italic;
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      font-family: Inter, system-ui, sans-serif;
      color: #101114;
      background: #fff;
      --gutter: clamp(20px, 5vw, 72px);
      --blue: #1530ef;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
      margin: 0;
    }

    a { color: inherit; }

    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 5px;
    }

    .header,
    main {
      width: min(100%, 1352px);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-block: 22px;
    }

    .brand,
    .contact {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
    }

    .brand img {
      display: block;
      width: clamp(92px, 8vw, 112px);
      height: auto;
      filter: brightness(0);
    }

    .contact,
    .projects {
      text-underline-offset: 5px;
      text-decoration-color: #a2a5b0;
    }

    .contact { font-size: 14px; }

    .contact:hover,
    .projects:hover { text-decoration-color: currentColor; }

    main {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
      align-items: center;
      align-self: center;
      gap: clamp(22px, 4vw, 58px);
      padding-block: 12px 85px;
    }

    .error-code {
      margin: 0 0 20px;
      color: #3b4a79;
      font-size: 14px;
      font-weight: 580;
      font-variant-numeric: tabular-nums;
    }

    h1 {
      margin: 0;
      font-size: clamp(56px, 7.7vw, 110px);
      font-weight: 520;
      line-height: .94;
      letter-spacing: -.052em;
    }

    h1 em {
      display: block;
      color: #1833b5;
      font-family: Aeonik, Inter, sans-serif;
      font-weight: 510;
    }

    .description {
      max-width: 34ch;
      margin: 25px 0 0;
      color: #50525e;
      font-size: clamp(17px, 1.5vw, 20px);
      line-height: 1.56;
      text-wrap: pretty;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 23px;
      margin-top: 30px;
    }

    .home,
    .projects {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      font-size: 14px;
      font-weight: 540;
      white-space: nowrap;
    }

    .home {
      padding-inline: 16px;
      border-radius: 9px;
      color: #fff;
      background: #15171c;
      text-decoration: none;
    }

    .home:hover { background: #263557; }

    .artwork {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1;
      isolation: isolate;
      perspective: 800px;
    }

    .artwork::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 10% 5% 3%;
      background: radial-gradient(ellipse at 53% 62%, #f0f4fe, transparent 67%);
    }

    .artwork::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: auto 20% 12%;
      height: 8%;
      border-radius: 50%;
      background: radial-gradient(ellipse, #1428583a, transparent 70%);
      filter: blur(10px);
    }

    .sculpture {
      width: min(100%, 620px);
      transform: translate(var(--shift-x, 0px), var(--shift-y, 0px))
        rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
    }

    .sculpture img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 740px) {
      .header { padding-block: 14px; }

      main {
        align-self: start;
        grid-template-columns: minmax(0, 1fr);
        width: min(100%, 540px);
        gap: 9px;
        padding-block: 0 52px;
      }

      .artwork {
        grid-row: 1;
        width: min(100%, 370px);
        margin-inline: auto;
      }

      .error-code { margin-bottom: 14px; }

      h1 { font-size: clamp(42px, 12.6vw, 63px); }

      h1 em { display: inline; }

      .description { margin-top: 17px; }

      .actions { margin-top: 21px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .sculpture { transition: transform .26s ease-out; }
      .sculpture img { animation: drift 4.4s ease-in-out both; }

      @keyframes drift {
        0% { opacity: .62; transform: translateY(16px) rotate(7deg) scale(.97); }
        35% { opacity: 1; transform: translateY(-13px) rotate(-5deg); }
        68% { transform: translateY(3px) rotate(2deg); }
        100% { transform: translateY(0) rotate(0); }
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="/" aria-label="IA BRAZIL, página inicial">
      <img src="/assets/brand/ia-brazil-wordmark.svg" alt="" width="960" height="326">
    </a>
    <a class="contact" href="/contato.html">Fale com a gente</a>
  </header>
  <main aria-labelledby="page-title">
    <div class="message">
      <p class="error-code">Erro 404 · Página não encontrada</p>
      <h1 id="page-title">Fora de <em>órbita.</em></h1>
      <p class="description">A página que você procura pode ter mudado de endereço.</p>
      <div class="actions">
        <a class="home" href="/"><span aria-hidden="true">←</span> Voltar ao início</a>
        <a class="projects" href="/cases.html">Ver projetos <span aria-hidden="true">↗</span></a>
      </div>
    </div>
    <div class="artwork" aria-hidden="true">
      <div class="sculpture">
        <img src="/assets/brand/orbita-404-vidro.webp" alt="" width="1254" height="1254" fetchpriority="high">
      </div>
    </div>
  </main>
  <script>
    const artwork = document.querySelector('.artwork');
    const motion = matchMedia('(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)');

    function resetTilt() {
      artwork.style.removeProperty('--shift-x');
      artwork.style.removeProperty('--shift-y');
      artwork.style.removeProperty('--tilt-x');
      artwork.style.removeProperty('--tilt-y');
    }

    artwork.addEventListener('pointermove', event => {
      if (!motion.matches || event.pointerType !== 'mouse') return;

      const bounds = artwork.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width - .5;
      const y = (event.clientY - bounds.top) / bounds.height - .5;

      artwork.style.setProperty('--shift-x', `${x * 26}px`);
      artwork.style.setProperty('--shift-y', `${y * 22}px`);
      artwork.style.setProperty('--tilt-x', `${y * -14}deg`);
      artwork.style.setProperty('--tilt-y', `${x * 17}deg`);
    }, { passive: true });

    artwork.addEventListener('pointerleave', resetTilt);
    motion.addEventListener('change', resetTilt);
  </script>
</body>
</html>
