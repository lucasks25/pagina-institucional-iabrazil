<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>404 — Página não encontrada | IA BRAZIL</title>
  <link rel="icon" href="/favicon.png" sizes="96x96" type="image/png">
  <style>
    @font-face {
      font-family: Inter;
      src: url("/assets/fonts/inter/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      font-family: Inter, system-ui, sans-serif;
      color: #101114;
      background: #fff;
      --gutter: clamp(18px, 5vw, 76px);
      --blue: #1530ef;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
      margin: 0;
    }

    a { color: inherit; }

    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 5px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: min(100%, 1352px);
      margin-inline: auto;
      padding: 24px var(--gutter);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
    }

    .brand img {
      display: block;
      width: clamp(92px, 8vw, 112px);
      height: auto;
      filter: brightness(0);
    }

    .contact,
    .projects {
      text-underline-offset: 5px;
      text-decoration-color: #9c9eaa;
    }

    .contact {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-size: 14px;
    }

    .contact:hover,
    .projects:hover { text-decoration-color: currentColor; }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      align-self: center;
      padding: 32px var(--gutter) 106px;
      text-align: center;
    }

    .code {
      display: flex;
      align-items: center;
      gap: .055em;
      padding-inline-end: .075em;
      margin-bottom: clamp(28px, 5vw, 58px);
      color: #101114;
      font-size: clamp(114px, 16vw, 218px);
      font-weight: 530;
      line-height: .9;
      letter-spacing: -.09em;
    }

    .zero {
      position: relative;
      color: var(--blue);
    }

    .orbit {
      position: absolute;
      inset: 53% auto auto 54%;
      display: grid;
      place-items: center;
      width: .30em;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #eff3ff;
      transform: translate(-50%, -50%);
    }

    .orbit-mark {
      width: 75%;
      aspect-ratio: 1;
      background: var(--blue);
      mask: url("/assets/brand/ia-brazil-orbital-mark.svg") center / contain no-repeat;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 4.8vw, 65px);
      font-weight: 530;
      line-height: 1.02;
      letter-spacing: -.066em;
      text-wrap: balance;
    }

    .message p {
      max-width: 42ch;
      margin: 18px auto 0;
      color: #4c5059;
      font-size: clamp(16px, 1.5vw, 19px);
      line-height: 1.55;
      text-wrap: pretty;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 23px;
      margin-top: 29px;
    }

    .home,
    .projects {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      font-size: 14px;
      font-weight: 540;
      white-space: nowrap;
    }

    .home {
      padding-inline: 16px;
      border-radius: 9px;
      color: #fff;
      background: #15171c;
      text-decoration: none;
    }

    .home:hover { background: #263557; }

    @media (max-width: 600px) {
      .header { padding-block: 15px; }

      main { padding-block: 38px 65px; }

      .code { font-size: clamp(112px, 32vw, 156px); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .orbit-mark { animation: orbit-turn 2.2s cubic-bezier(.38, .08, .28, 1) 2; }

      @keyframes orbit-turn {
        from { transform: rotate(0); }
        to { transform: rotate(360deg); }
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="/" aria-label="IA BRAZIL, página inicial">
      <img src="/assets/brand/ia-brazil-wordmark.svg" alt="" width="960" height="326">
    </a>
    <a class="contact" href="/contato.html">Fale com a gente</a>
  </header>
  <main aria-labelledby="page-title">
    <div class="code" aria-hidden="true">4<span class="zero">0<span class="orbit"><span class="orbit-mark"></span></span></span>4</div>
    <div class="message">
      <h1 id="page-title">Página não encontrada.</h1>
      <p>Confira o endereço ou use um dos atalhos abaixo para continuar.</p>
      <div class="actions">
        <a class="home" href="/"><span aria-hidden="true">←</span> Voltar ao início</a>
        <a class="projects" href="/cases.html">Ver projetos <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </main>
</body>
</html>
